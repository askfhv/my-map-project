            // Mobile gestures use real finger displacement and distance, without fixed zoom steps.
            const mapElement = document.getElementById('china-map');
            const directTouch = window.matchMedia('(pointer: coarse)').matches;
            let suppressMapClickUntil = 0;
            if (directTouch) {
                mapElement.style.touchAction = 'none';
                let previousTouch = null;
                let touchMoved = false;

                function touchSnapshot(touches) {
                    const points = Array.from(touches).slice(0, 2).sort((a, b) => a.identifier - b.identifier);
                    if (!points.length) return null;
                    const rect = mapElement.getBoundingClientRect();
                    const first = points[0], second = points[1] || first;
                    return {
                        ids: points.map(point => point.identifier).join(','),
                        x: (first.clientX + second.clientX) / 2 - rect.left,
                        y: (first.clientY + second.clientY) / 2 - rect.top,
                        distance: points.length === 2
                            ? Math.hypot(first.clientX - second.clientX, first.clientY - second.clientY) : 0
                    };
                }

                mapElement.addEventListener('touchstart', event => {
                    // Gestures take over immediately; do not let a tap transition keep moving the map.
                    chart.setOption({ series: [{ animation: false }] });
                    if (event.touches.length === 1) {
                        touchMoved = false;
                        suppressMapClickUntil = 0;
                    } else {
                        touchMoved = true;
                        suppressMapClickUntil = Date.now() + 500;
                        if (event.cancelable) event.preventDefault();
                    }
                    previousTouch = touchSnapshot(event.touches);
                }, { passive: false, capture: true });

                mapElement.addEventListener('touchmove', event => {
                    const next = touchSnapshot(event.touches);
                    if (event.cancelable) event.preventDefault();
                    if (!next || !previousTouch || next.ids !== previousTouch.ids) {
                        previousTouch = next;
                        return;
                    }
                    const dx = next.x - previousTouch.x;
                    const dy = next.y - previousTouch.y;
                    const scale = previousTouch.distance > 0 && next.distance > 0
                        ? next.distance / previousTouch.distance : 1;
                    if (dx !== 0 || dy !== 0 || scale !== 1) {
                        touchMoved = true;
                        suppressMapClickUntil = Date.now() + 500;
                        if (dx !== 0 || dy !== 0) {
                            chart.dispatchAction({ type: 'geoRoam', componentType: 'series', seriesIndex: 0, dx, dy });
                        }
                        if (Number.isFinite(scale) && scale > 0 && scale !== 1) {
                            chart.dispatchAction({
                                type: 'geoRoam', componentType: 'series', seriesIndex: 0,
                                zoom: scale, originX: next.x, originY: next.y
                            });
                        }
                    }
                    previousTouch = next;
                }, { passive: false, capture: true });

                function finishTouch(event) {
                    if (touchMoved) {
                        suppressMapClickUntil = Date.now() + 500;
                        if (event.cancelable) event.preventDefault();
                    }
                    // Rebase when a finger is lifted so the next move cannot jump.
                    previousTouch = event.type === 'touchcancel' ? null : touchSnapshot(event.touches);
                    if (!previousTouch) touchMoved = false;
                }
                mapElement.addEventListener('touchend', finishTouch, { passive: false, capture: true });
                mapElement.addEventListener('touchcancel', finishTouch, { passive: false, capture: true });
                mapElement.addEventListener('click', event => {
                    if (Date.now() < suppressMapClickUntil) {
                        event.preventDefault();
                        event.stopImmediatePropagation();
                    }
                }, true);

            // 每年维护省级 posted_this_year：1 为已出公告，0 为未出公告。
            function showOverview() {
                const isChina = currentLevel === 'china';
                const postedCount = policyData.filter(region => region.posted_this_year === 1).length;
                document.getElementById('selectedRegion').innerText = isChina ? '全国总览' : '上海市总览';
                document.getElementById('regionData').innerText = isChina
                    ? `今年已有${postedCount}个省（浅金色）发布公告，请点击区域查看详情，单击条目小标题可以跳转链接`
                    : '请点击区域查看详情，单击条目小标题可以跳转链接';
            }

            const mapCache = new Map();
            let activeGeoJson = null;
            function loadMap(url) {
                if (!mapCache.has(url)) {
                    mapCache.set(url, fetch(url).then(res => {
                        if (!res.ok) throw new Error('地图请求失败');
                        return res.json();
                    }).catch(error => { mapCache.delete(url); throw error; }));
                }
                return mapCache.get(url);
            }

            function switchMap(mapName, url, isChina) {
                loadMap(url).then(geoJson => {
                    activeGeoJson = geoJson;
                    echarts.registerMap(mapName, geoJson);
                    const silentStyles = forbiddenRegions.map(name => ({
                        name: name,
                        itemStyle: { areaColor: '#f2f2f2' },
                        emphasis: { disabled: true },
                        label: { show: false },
                        select: { disabled: true }
                    }));

                    const option = {
                        tooltip: { show: !directTouch, trigger: 'item', formatter: (params) => forbiddenRegions.includes(params.name) ? null : params.name },
                        series: [{
                            name: 'map', type: 'map', map: mapName, roam: !directTouch,
                            animation: !directTouch,
                            scaleLimit: { min: isChina ? 1 : 0.8, max: 15 },
                            layoutCenter: ['50%', isChina ? '60%' : '50%'], layoutSize: '90%',
                            zoom: isChina ? 1.2 : 1, center: null,
                            label: { show: true, fontSize: 10 },
                            itemStyle: { areaColor: '#f9f9f9', borderColor: '#777777', borderWidth: 0.7 },
                            emphasis: { itemStyle: { areaColor: '#ffe4e1' } },
                            select: { itemStyle: { areaColor: '#0052d9' }, label: { color: '#fff' } },
                            selectedMode: 'single',
                            data: isChina ? policyData.map(region => ({
                                ...region,
                                itemStyle: { areaColor: region.posted_this_year === 1 ? '#f6dfa0' : '#f9f9f9' },
                                emphasis: { itemStyle: { areaColor: region.posted_this_year === 1 ? '#edca73' : '#ffe4e1' } }
                            })) : [],
                            regions: silentStyles
                        }]
                    };
                    chart.setOption(option, true);
                }).catch(() => {
                    document.getElementById('regionData').innerText = '地图加载失败，请检查网络后刷新重试。';
                });
            }

            function restoreMapViewport() {
                mapElement.style.height = '100%';
                chart.resize();
            }

            function focusProvince(name) {
                const pos = geoCoordMap[name];
                const zoom = zoomConfig[name] || 6;
                if (!directTouch) {
                    chart.setOption({ series: [{ center: pos || null, zoom, transition: ['center', 'zoom'] }] });
                    return;
                }
                const container = mapElement.parentElement.getBoundingClientRect();
                const card = document.querySelector('.info-card').getBoundingClientRect();
                const availableHeight = Math.max(120, Math.min(container.height, card.top - container.top - 16));
                mapElement.style.height = availableHeight + 'px';
                chart.resize();
                // Fit the main landmass; distant offshore islands must not shrink the province to a dot.
                const feature = activeGeoJson && activeGeoJson.features.find(item => item.properties.name === name);
                const geometry = feature && feature.geometry;
                const polygons = geometry && (geometry.type === 'MultiPolygon' ? geometry.coordinates
                    : geometry.type === 'Polygon' ? [geometry.coordinates] : []);
                let bounds = null, largestArea = -1;
                (polygons || []).forEach(polygon => {
                    const ring = polygon[0];
                    if (!ring || !ring.length) return;
                    const xs = ring.map(point => point[0]), ys = ring.map(point => point[1]);
                    const box = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
                    const area = (box[2] - box[0]) * (box[3] - box[1]);
                    if (area > largestArea) { largestArea = area; bounds = box; }
                });
                const center = bounds ? [(bounds[0] + bounds[2]) / 2, (bounds[1] + bounds[3]) / 2] : pos;
                const currentZoom = chart.getOption().series[0].zoom || 1;
                let fittedZoom = zoom;
                if (bounds) {
                    const a = chart.convertToPixel({ seriesIndex: 0 }, [bounds[0], bounds[1]]);
                    const b = chart.convertToPixel({ seriesIndex: 0 }, [bounds[2], bounds[3]]);
                    const width = Math.abs(b[0] - a[0]), height = Math.abs(b[1] - a[1]);
                    if (width > 0 && height > 0) {
                        fittedZoom = Math.min(zoom, currentZoom * (chart.getWidth() - 32) / width, currentZoom * (availableHeight - 32) / height);
                    }
                }
                chart.setOption({ series: [{
                    center: center || null,
                    zoom: Math.max(currentLevel === 'china' ? 1 : 0.8, fittedZoom),
                    layoutCenter: ['50%', '50%'],
                    animation: true, animationDurationUpdate: 400, animationEasingUpdate: 'cubicOut'
                }] });
                chart.dispatchAction({ type: 'hideTip' });
            }

            showOverview();
            switchMap('china', './china.json', true);

            resetBtn.onclick = function () {
                restoreMapViewport();
                chart.setOption({ series: [{ center: null, zoom: currentLevel === 'china' ? 1.2 : 1, layoutCenter: ['50%', currentLevel === 'china' ? '60%' : '50%'], animation: true, animationDurationUpdate: 400, animationEasingUpdate: 'cubicOut' }] });
                currentSelected = null;
                showOverview();
                chart.dispatchAction({ type: 'unSelect' });
            };

            chart.on('click', function (params) {
                if (Date.now() < suppressMapClickUntil) return;
                const name = params.name;
                if (forbiddenRegions.includes(name)) {
                    chart.dispatchAction({ type: 'unSelect', name: name });
                    return; 
                }
                if (currentSelected === name) {
                    restoreMapViewport();
                chart.setOption({ series: [{ center: null, zoom: currentLevel === 'china' ? 1.2 : 1, layoutCenter: ['50%', currentLevel === 'china' ? '60%' : '50%'], animation: true, animationDurationUpdate: 400, animationEasingUpdate: 'cubicOut' }] });
                    currentSelected = null;
                    showOverview();
                } else {
                    currentSelected = name;
                    showInfoCard(name);
                    focusProvince(name);
                }
            });

            function showInfoCard(regionName) {
                const match = policyData.find(p => p.name === regionName);
                const titleEl = document.getElementById('selectedRegion');
                const contentEl = document.getElementById('regionData');
                titleEl.innerText = regionName;

                if (match && match.policies && match.policies.length > 0) {
                    let html = '';
                    if (match.policies && match.policies.length > 0) {
                        match.policies.forEach(item => {
                            const hasUrl = item.url && item.url !== '#';
                            html += `
                                <div class="policy-item">
                                    ${hasUrl ? `<a href="${item.url}" target="_blank" class="policy-title-base policy-link">${item.title}</a>` : `<div class="policy-title-base policy-text">${item.title}</div>`}
                                    <div class="policy-desc">${item.desc}</div>
                                    ${item.require ? `<div class="policy-require"><strong>硬性要求：</strong>${item.require}</div>` : ''}
                                </div>
                            `;
                        });
                    } else {
                        html += `<strong>政策：</strong>${match.policy || '暂无数据'}<br><strong>详情：</strong>${match.info || '暂无数据'}<br>`;
                    }

                    // 暂时关闭上海入口逻辑
                    // 这里注释掉了生成“进入上海市详细地图”按钮的代码
                    /*
                    if (regionName === '上海市' && currentLevel === 'china') {
                        html += `<br><div class="enter-sh-btn" id="enterSH">进入上海市详细地图 →</div>`;
                    }
                    */

                    contentEl.innerHTML = html;

                    // 这里原本绑定的按钮点击事件也无需执行
                    /*
                    if (document.getElementById('enterSH')) {
                        document.getElementById('enterSH').onclick = function () {
                            currentLevel = 'shanghai';
                            backBtn.style.display = 'block';
                            currentSelected = null;
                            switchMap('shanghai', './shanghai.json', false);
                            document.getElementById('selectedRegion').innerText = "上海市总览";
                            document.getElementById('regionData').innerText = "已进入上海详细地图，请点击各区。";
                        };
                    }
                    */
                } else {
                    contentEl.innerText = "我校暂未被纳入选调范围";
                }
            }

            backBtn.onclick = function () {
                currentLevel = 'china';
                currentSelected = null;
                backBtn.style.display = 'none';
                restoreMapViewport();
                switchMap('china', './china.json', true);
                showOverview();
            };


            window.addEventListener('resize', () => {
                chart.resize();
                if (directTouch && currentSelected) focusProvince(currentSelected);
            });
        });
